name: Auditoría diaria de integridad de carrera

# Corre contra el proyecto Supabase de producción (secrets REACT_APP_SUPABASE_*).
# - Checks públicos: anon key (misma que el navegador).
# - Checks ops-only (_riviera_orphan_profile_audit): SUPABASE_SERVICE_ROLE_KEY
#   (recomendado: GitHub Environment "production-audit" con secret restringido).
on:
  schedule:
    - cron: "0 13 * * *" # 07:00 hora CDMX (UTC-6) aprox.
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/audit-career-integrity.mjs"
      - "scripts/audit-rls-public-isolation.mjs"
      - "scripts/audit-global-career-parity.mjs"
      - "scripts/run-audit-suite-ci.mjs"
      - ".github/workflows/audit-career-integrity-daily.yml"

concurrency:
  group: audit-career-integrity
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Descomentar cuando configures el Environment en GitHub (ver docs abajo):
    # environment: production-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Un solo step: el orquestador ejecuta TODAS las auditorías aunque alguna
      # falle (spawnSync secuencial). El job falla al final si cualquiera falló.
      - name: Suite de auditorías online (prod)
        run: node scripts/run-audit-suite-ci.mjs
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUDIT_LIGA_PUBLIC_ID: 08d658c9-ebf5-411f-bfff-c764f3226858
          AUDIT_LIGA_PRIVATE_ID: ${{ secrets.AUDIT_LIGA_PRIVATE_ID }}

name: Auditoría diaria de integridad de carrera

# Corre sola todos los días contra producción.
# - Checks públicos: anon key (misma que el navegador).
# - Checks ops-only (_riviera_orphan_profile_audit): SUPABASE_SERVICE_ROLE_KEY.
# También se puede disparar a mano desde la pestaña Actions de GitHub.
on:
  schedule:
    - cron: "0 13 * * *" # 07:00 hora CDMX (UTC-6) aprox.
  workflow_dispatch: {}

concurrency:
  group: audit-career-integrity
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auditoría de integridad de carrera (online, producción)
        run: npm run audit:career-integrity
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Auditoría de aislamiento RLS público (SEC-001, online, producción)
        run: npm run audit:rls-public-isolation
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          AUDIT_LIGA_PUBLIC_ID: 08d658c9-ebf5-411f-bfff-c764f3226858
          AUDIT_LIGA_PRIVATE_ID: ${{ secrets.AUDIT_LIGA_PRIVATE_ID }}

      # Si alguna auditoría falla (huérfanos HIGH con puntos, metadata rota,
      # política RLS abierta reaparecida, etc.), el paso correspondiente sale
      # con exit code 1 y este job se marca en rojo.

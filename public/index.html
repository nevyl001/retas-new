<!DOCTYPE html>
<html lang="es" class="branding-bootstrapping">

<head>
    <meta charset="utf-8" />
    <style>
      html.branding-bootstrapping,
      html.branding-bootstrapping body,
      html.branding-bootstrapping #root {
        background-color: #12161B;
        color: #EFEFEF;
        transition: none !important;
      }
      html[data-brand="padel-court-series"],
      html[data-brand="padel-court-series"] body,
      html[data-brand="padel-court-series"] #root {
        background-color: #192E2C;
        color: #EFEFEF;
      }
      html[data-brand="hack-padel"],
      html[data-brand="hack-padel"] body,
      html[data-brand="hack-padel"] #root {
        background-color: #0D0D0D;
        color: #EFEFEF;
      }
      html.branding-transitioning #root {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      html.branding-transitioning body {
        background-color: #12161B;
        transition: none !important;
      }
      html[data-brand="padel-court-series"].branding-transitioning body {
        background-color: #192E2C;
      }
      html[data-brand="hack-padel"].branding-transitioning body {
        background-color: #0D0D0D;
      }
    </style>
    <script>
      (function () {
        try {
          var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
          if (
            path === "/auth/callback" ||
            path === "/auth/reset-password" ||
            path === "/admin-login" ||
            path === "/privacidad-terminos" ||
            /^\/jugar\//i.test(path) ||
            /^\/reta-abierta\//i.test(path) ||
            /^\/public\//i.test(path) ||
            /^\/eventos\//i.test(path)
          ) {
            return;
          }
          var raw = localStorage.getItem("ro_club_experience_v1");
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var key = parsed && parsed.brandingKey;
          if (key !== "padel-court-series" && key !== "hack-padel") return;
          document.documentElement.setAttribute("data-brand", key);
          document.documentElement.setAttribute("data-club", key);
          document.documentElement.classList.remove("branding-bootstrapping");
        } catch (e) {}
      })();
    </script>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script>
        // Hotfix: desactivar Service Worker para evitar fallos de red
        // (especialmente en refresh de token de Supabase).
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.getRegistrations()
                    .then((registrations) => {
                        return Promise.all(registrations.map((registration) => registration.unregister()));
                    })
                    .catch((error) => {
                        console.log('SW unregister failed:', error);
                    });
            });
        }
    </script>
